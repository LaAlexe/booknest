name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://booknest:booknest@localhost:5432/booknest_test?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: booknest_test
          POSTGRES_USER: booknest
          POSTGRES_PASSWORD: booknest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booknest -d booknest_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate --workspace @booknest/api

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace @booknest/api

      - name: Apply Prisma migrations
        run: npm exec --workspace @booknest/api -- prisma migrate deploy

      - name: Lint Angular frontend
        run: npm run lint --workspace @booknest/web

      - name: Test Angular frontend
        run: npm run test --workspace @booknest/web -- --watch=false

      - name: Build Angular frontend
        run: npm run build --workspace @booknest/web

      - name: Lint NestJS backend
        run: npm run lint --workspace @booknest/api

      - name: Test NestJS backend
        run: npm run test --workspace @booknest/api

      - name: Test NestJS backend end to end
        run: npm run test:e2e --workspace @booknest/api

      - name: Build NestJS backend
        run: npm run build --workspace @booknest/api

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: quality

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::232499238241:role/BookNestGitHubDeployRole
          aws-region: eu-central-1

      - name: Deploy BookNest API
        id: deploy
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0a82221fdbe609932" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy BookNest ${DEPLOY_SHA}" \
            --parameters "commands=[
              \"set -e\",
              \"sudo -u ec2-user -H bash -lc 'cd /home/ec2-user/apps/booknest && git fetch origin main && git checkout main && git reset --hard ${DEPLOY_SHA}'\",
              \"sudo -u ec2-user -H bash -lc 'cd /home/ec2-user/apps/booknest && npm ci --include=dev'\",
              \"sudo -u ec2-user -H bash -lc 'cd /home/ec2-user/apps/booknest && npm run prisma:generate --workspace @booknest/api'\",
              \"sudo -u ec2-user -H bash -lc 'cd /home/ec2-user/apps/booknest && npm run prisma:migrate:deploy --workspace @booknest/api'\",
              \"sudo -u ec2-user -H bash -lc 'cd /home/ec2-user/apps/booknest && npm run build --workspace @booknest/api'\",
              \"systemctl restart booknest-api\",
              \"sleep 3\",
              \"curl --fail --silent --show-error http://localhost:3000/api/v1/health\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "i-0a82221fdbe609932"

      - name: Show deployment result
        if: always() && steps.deploy.outputs.command_id != ''
        run: |
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "i-0a82221fdbe609932" \
            --query '{Status:Status,ResponseCode:ResponseCode,Output:StandardOutputContent,Error:StandardErrorContent}'
